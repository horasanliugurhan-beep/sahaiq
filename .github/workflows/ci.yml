name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Static build (same files as GitHub Pages)
        run: npm run build:static
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (Playwright + axe)
        run: npm run test:e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
